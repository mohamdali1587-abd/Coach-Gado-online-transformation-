  --red:#DB2126; --black:#000000; --white:#FFFFFF;
  --paper:#F2F2F2; --ink:#0D0D0D; --muted:#595959; --line:#CFCFCF; --field:#FFFFFF;
  --display:'Lalezar','Cairo','Segoe UI',Tahoma,sans-serif;
  --body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#121212;--ink:#F2F2F2;--muted:#A8A8A8;--line:#2E2E2E;--field:#1C1C1C}
}
:root[data-theme="dark"]{--paper:#121212;--ink:#F2F2F2;--muted:#A8A8A8;--line:#2E2E2E;--field:#1C1C1C}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));background:#000}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:#000;color:var(--white);font-family:var(--body);font-size:1.0625rem;line-height:1.75;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.2}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.paper :focus-visible{outline-color:var(--red)}
.wrap{width:100%;max-width:1160px;margin-inline:auto;padding-inline:max(20px,env(safe-area-inset-left,0px)) }
section{padding-block:clamp(64px,9vw,120px)}
.paper{background:var(--paper);color:var(--ink)}
.red{background:var(--red);color:#fff}
.black{background:#000;color:#fff}
.h2{font-size:clamp(2.1rem,5.2vw,3.6rem);margin-bottom:clamp(28px,4vw,52px);max-width:18ch}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#000;border-bottom:1px solid #222}
.bar{display:flex;align-items:center;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:600 1.05rem/1 'Montserrat','Segoe UI',system-ui,sans-serif;letter-spacing:.06em;direction:ltr}
.brand .mk{width:30px;height:34px;flex:none}
nav{display:none;gap:26px;margin-inline-start:auto}
nav a{text-decoration:none;font-weight:500;font-size:.98rem;color:#d8d8d8;padding:8px 2px}
nav a:hover{color:#fff}
.tools{display:flex;align-items:center;gap:10px;margin-inline-start:auto}
@media (min-width:860px){nav{display:flex}.tools{margin-inline-start:0}}
.lang{min-height:44px;min-width:56px;background:transparent;color:#fff;border:1px solid #444;border-radius:4px;font:600 .95rem var(--body);cursor:pointer}
.lang:hover{border-color:#fff}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 26px;border-radius:4px;border:2px solid transparent;font:600 1.05rem var(--body);text-decoration:none;cursor:pointer;line-height:1.2}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:#b9161b}
.btn-line{border-color:#fff;color:#fff;background:transparent}
.btn-line:hover{background:#fff;color:#000}
.btn-black{background:#000;color:#fff}
.btn-black:hover{background:#222}
.btn-sm{min-height:44px;padding:0 18px;font-size:.98rem}

/* hero */
.hero{padding-block:clamp(40px,7vw,96px) clamp(48px,7vw,96px);overflow:hidden}
.hero .wrap{display:grid;gap:36px;align-items:center}
@media (min-width:900px){.hero .wrap{grid-template-columns:1.25fr .75fr}}
.hero h1{font-size:clamp(2.9rem,8.2vw,6.2rem);line-height:1.12;white-space:pre-line}
.hero p.lead{margin-top:22px;font-size:1.15rem;max-width:34em;color:#e6e6e6}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hero .proof{margin-top:22px;font-size:.95rem;color:#b5b5b5}
.mark{display:flex;justify-content:center}
.mk{display:block;background:var(--mark) center/contain no-repeat}
.mark .mk{width:min(56vw,360px);aspect-ratio:492/560;animation:reveal 1.2s cubic-bezier(.6,.05,.2,1) both}
@keyframes reveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion: reduce){.mark .mk{animation:none}html{scroll-behavior:auto}}

/* services */
.rows{border-top:2px solid var(--ink)}
.row{display:grid;gap:8px 40px;padding:26px 0;border-bottom:1px solid var(--line)}
@media (min-width:800px){.row{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:baseline}}
.row h3{font-size:clamp(1.5rem,2.8vw,2.1rem)}
.row p{color:var(--muted);max-width:40em}

/* steps */
.steps{display:grid;gap:34px 28px}
@media (min-width:700px){.steps{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1040px){.steps{grid-template-columns:repeat(4,1fr)}}
.step{border-top:3px solid #fff;padding-top:14px}
.step .n{font-family:var(--display);font-size:4.4rem;line-height:1;display:block;direction:ltr;text-align:start}
.step h3{font-size:1.6rem;margin:6px 0 8px}
.step p{font-size:1rem}

/* audience */
.aud{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.aud li{font-family:var(--display);font-size:clamp(1.35rem,3vw,2.2rem);line-height:1.35;padding:18px 0 18px 0;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline}
.aud li::before{content:"";flex:none;width:14px;height:14px;background:var(--red);transform:translateY(1px)}

/* results */
.results .head{max-width:46em}
.results .btn{margin-top:26px}
.gallery{columns:1;column-gap:18px;margin-top:clamp(32px,5vw,56px)}
@media (min-width:640px){.gallery{columns:2}}
@media (min-width:1000px){.gallery{columns:3}}
.gallery figure{margin:0 0 18px;break-inside:avoid}
.gallery img{width:100%;height:auto;display:block;border-radius:4px;background:#111}
.results p{color:#d0d0d0;max-width:34em}
.results .h2{margin-bottom:18px}

/* faq */
details{border-bottom:1px solid var(--line)}
.faqs{border-top:2px solid var(--ink);max-width:860px}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;font-family:var(--display);font-size:clamp(1.25rem,2.4vw,1.7rem);line-height:1.35}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:400 2rem/1 var(--display);color:var(--red);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details p{padding:0 0 24px;color:var(--muted);max-width:44em}

/* apply */
.apply .wrap{display:grid;gap:40px;align-items:start}
@media (min-width:900px){.apply .wrap{grid-template-columns:1fr 1fr}}
.apply .lead{font-size:1.15rem;max-width:30em}
.card{background:var(--paper);color:var(--ink);padding:clamp(22px,3vw,36px);border-radius:4px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-weight:600;font-size:.98rem}
.field input,.field select,.field textarea{width:100%;min-height:48px;padding:10px 14px;background:var(--field);color:var(--ink);border:1.5px solid var(--line);border-radius:4px;font:400 1rem var(--body)}
.field textarea{min-height:90px;resize:vertical}
.two{display:grid;gap:16px}
@media (min-width:520px){.two{grid-template-columns:1fr 1fr}}
.card .btn{width:100%}
.meet{border-top:1px solid #222}
.meet .wrap{display:grid;gap:36px;align-items:center}
@media (min-width:900px){.meet .wrap{grid-template-columns:4fr 7fr}}
.meet img{width:100%;max-width:440px;height:auto;display:block;border-radius:4px;margin-inline:auto}
.meet .h2{margin-bottom:6px}
.meet .role{font-family:var(--display);font-size:1.5rem;color:#fff;margin-bottom:14px}
.meet .intro{color:#d0d0d0;max-width:36em}
.stats{display:flex;flex-wrap:wrap;gap:12px 44px;margin:24px 0 28px}
.stats b{display:block;font-family:var(--display);font-weight:400;font-size:3.6rem;line-height:1;color:var(--red)}
.stats span{font-size:.98rem;color:#d0d0d0}
.facts{display:grid;gap:20px}
.facts h3{font-size:1.6rem;margin-bottom:2px}
.facts p,.facts li{color:#d0d0d0;max-width:38em}
.facts ul{margin:0;padding-inline-start:20px}
.plans{display:grid;gap:22px;align-items:stretch}
@media (min-width:860px){.plans{grid-template-columns:1fr 1fr}}
.plan{background:var(--paper);color:var(--ink);padding:clamp(24px,3vw,38px);border-radius:4px;display:flex;flex-direction:column}
.plan.vip{--ink:#fff;--muted:#b5b5b5;--line:#333;background:#000;color:#fff}
.plan h3{font-size:2.2rem}
.plan .pd{color:var(--muted);margin:4px 0 16px}
.feat{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:6px}
.feat li{position:relative;padding-inline-start:22px;line-height:1.55}
.feat li::before{content:"";position:absolute;inset-inline-start:0;top:.62em;width:10px;height:10px;background:var(--red)}
.prow{display:grid;grid-template-columns:1fr auto;gap:0 16px;align-items:baseline;padding:14px 0;border-top:1px solid var(--line)}
.prow .dur{font-weight:600}
.prow .amt{font-size:1rem;text-align:end}
.prow .amt b{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.1}
.prow small{grid-column:1/-1;color:var(--muted);font-size:.92rem}
.plan .btn{margin-top:auto;width:100%}
.plan .prow:last-of-type{margin-bottom:22px}
.card h3{font-size:1.9rem;margin-bottom:8px}
.cardp{color:var(--muted);margin-bottom:22px}
.alt{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:20px}
.alt a{color:var(--ink);font-weight:600;padding:10px 0}
.out{margin-top:18px}
.out[hidden]{display:none}
.out p{font-size:.95rem;color:var(--muted);margin-bottom:8px}
.out textarea{width:100%;min-height:150px;padding:10px 14px;background:var(--field);color:var(--ink);border:1.5px solid var(--line);border-radius:4px;font:400 .95rem var(--body)}
.out .btn{margin-top:10px}
.status{min-height:1.4em;font-weight:600;margin-top:10px}

/* footer */
footer{background:#000;color:#b5b5b5;padding-block:36px calc(36px + env(safe-area-inset-bottom,0px));border-top:1px solid #222;font-size:.95rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between}
footer a{color:#fff}
</style>
</head>
